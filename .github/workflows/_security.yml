# ==============================================================================
# Reusable: Security Gates
# ==============================================================================
# Secrets -> SAST -> SCA -> IaC
#
# POLICY:
#   secret detected             -> BLOCK
#   SAST error severity         -> BLOCK
#   dependency HIGH / CRITICAL -> BLOCK
#   IaC HIGH / CRITICAL        -> BLOCK
#
# Exceptions must be documented in docs/ci-cd.md with a scope + expiry.
# ==============================================================================

name: _security

on:
  workflow_call:
    inputs:
      run-codeql:
        description: 'Run CodeQL SAST analysis'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.17.0'
  PNPM_VERSION: '10.34.6'

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

  # ============================================================================
  # Secret Scanning
  # ============================================================================
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  # ============================================================================
  # SAST - CodeQL
  # ============================================================================
  sast:
    name: SAST (CodeQL)
    if: inputs.run-codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # CodeQL needs:
    #   contents: read          -> checkout/source access
    #   actions: read           -> workflow/run metadata
    #   security-events: write  -> upload SARIF/code-scanning results
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Fork PRs get a read-only token and cannot publish SARIF.
      - name: Analyze
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # SCA - Dependency Scanning
  # ============================================================================
  dependency-scan:
    name: SCA (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # HIGH and CRITICAL vulnerabilities block the pipeline.
      # Production dependencies only.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # ============================================================================
  # IaC Security Scanning
  # ============================================================================
  iac-scan:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a full commit SHA.
      #
      # Never use:
      #   aquasecurity/trivy-action@master
      #
      # Mutable tags/branches can be changed after review.
      - name: Scan Dockerfile and Compose manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
