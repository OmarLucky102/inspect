# ==============================================================================
# Reusable: Security Gates
# ==============================================================================
# Secrets -> SAST -> SCA -> IaC -> policy gate
#
# POLICY (see docs/ci-cd.md for the full table):
#   secret detected            -> BLOCK
#   SAST error severity        -> BLOCK
#   dependency HIGH / CRITICAL -> BLOCK
#   IaC HIGH / CRITICAL         -> BLOCK
#
# Exceptions must be documented in docs/ci-cd.md with a scope + expiry.
# ==============================================================================
name: _security

on:
  workflow_call:
    secrets:
      CODEQL_UPLOAD_TOKEN:
        description: 'Optional. Falls back to GITHUB_TOKEN when unset.'
        required: false
    inputs:
      run-codeql:
        description: 'Run CodeQL SAST analysis'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.17.0'
  PNPM_VERSION: '10.34.6'

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  sast:
    name: SAST (CodeQL)
    if: inputs.run-codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Fork PRs get a read-only token and cannot publish SARIF.
      - name: Analyze
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
        env:
          GITHUB_TOKEN: ${{ secrets.CODEQL_UPLOAD_TOKEN || secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: SCA (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --audit-level=high makes the command exit non-zero on HIGH and CRITICAL.
      # --prod keeps dev-only tooling advisories from blocking releases.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  iac-scan:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a full commit SHA, never a tag or a branch. `@master` is a
      # mutable reference: it is the exact vector used in CVE-2026-33634, where
      # 76 of 77 trivy-action tags were force-pushed to an infostealer.
      - name: Scan Dockerfile and Compose manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
