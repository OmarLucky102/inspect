# ==============================================================================
# Reusable: Security Gates
# ==============================================================================
# Secrets -> SAST -> SCA -> IaC -> policy gate
#
# POLICY (see docs/ci-cd.md for the full table):
#   secret detected            -> BLOCK
#   SAST error severity        -> BLOCK
#   dependency HIGH / CRITICAL -> BLOCK
#   IaC HIGH / CRITICAL         -> BLOCK
#
# Exceptions must be documented in docs/ci-cd.md with a scope + expiry.
# ==============================================================================
name: _security

on:
  workflow_call:
    secrets:
      CODEQL_UPLOAD_TOKEN:
        description: 'Optional. Falls back to GITHUB_TOKEN when unset.'
        required: false
    inputs:
      run-codeql:
        description: 'Run CodeQL SAST analysis'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.17.0'
  PNPM_VERSION: '10.34.6'

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  sast:
    name: SAST (CodeQL)
    if: inputs.run-codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Fork PRs get a read-only token and cannot publish SARIF.
      - name: Analyze
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          category: /language:javascript-typescript

      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          category: /language:javascript-typescript
          sarif_file: codeql-results.sarif

  dependency-scan:
    name: SCA (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --audit-level=high makes the command exit non-zero on HIGH and CRITICAL.
      # --prod keeps dev-only tooling advisories from blocking releases.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  iac-scan:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Scan Dockerfile and Compose manifests
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
