name: Inspect CI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Backend CI
  # ============================================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inspect?schema=public

      - name: Run Backend Linting
        run: pnpm run lint

      - name: Run Backend Unit Tests
        run: pnpm run test

      - name: Build Backend
        run: pnpm run build

  # ============================================================================
  # 2. Frontend CI
  # ============================================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Linting
        run: pnpm --filter admin run lint

      - name: Build Frontend
        run: pnpm --filter admin run build

  # ============================================================================
  # 3. Docker Build Verification
  # ============================================================================
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Configuration Files (.env and s3.json)
        run: |
          cp .env.example .env
          cp s3.json.example s3.json

      - name: Build Compose Images
        run: docker compose --profile migration build
        env:
          DOCKER_BUILDKIT: 1
          SERVER_PORT: 8000
          FRONTEND_PORT: 80
          VITE_API_URL: /api/v1