version: 2

updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    versioning-strategy: "widen"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    allow:
      - dependency-type: "direct"
    ignore:
      # Keep major version upgrades explicit for compatibility-sensitive packages
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
    groups:
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      nest:
        patterns:
          - "@nestjs/*"
          - "reflect-metadata"
          - "rxjs"
      testing:
        patterns:
          - "jest"
          - "ts-jest"
          - "@types/jest"
          - "supertest"
          - "@types/supertest"
          - "ts-node"
          - "@types/node"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "ts-loader"
      linting:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier"
          - "globals"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
