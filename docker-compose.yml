name: inspect

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-inspect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-inspect}',
        ]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - inspect_network

  # ============================================================================
  # 2. SeaweedFS Object Storage Service (S3-compatible)
  # ============================================================================
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-wtsALbBxZ87CPoQuTMHJ5YcXkvjehngr}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-EF33E57037B7C56AC140CE55B900CE7A99AF1DAC1C3F8FAC87EBCBD26FE179BB549AC134543403CB9404ABD4011C6589}
    entrypoint:
      - /bin/sh
      - -c
      - >
        printf '{"identities":[{"name":"inspect-app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging","Admin"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -ip=seaweedfs -s3.port=8333
    volumes:
      - seaweedfs_data:/data
    ports:
      - '8333:8333'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1:9333/dir/status || exit 1',
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - inspect_network

  # ============================================================================
  # 3. NestJS Application Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PORT: ${SERVER_PORT:-18080}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVER_PORT=${SERVER_PORT:-18080}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-inspect}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-inspect}?schema=public
      - S3_ENDPOINT=${S3_ENDPOINT:-http://seaweedfs:8333}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-inspect-bucket}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - '${SERVER_PORT:-18080}:${SERVER_PORT:-18080}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:${SERVER_PORT:-18080}/health || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - inspect_network

  # ============================================================================
  # 4. Prisma Migration & Seed Service (Profile: migration)
  #    Run manually via: docker compose --profile migration up migration
  # ============================================================================
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: 'no'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-inspect}?schema=public
    command: sh -c "node -e \"require('child_process').execSync('npx prisma migrate deploy', {stdio:'inherit'})\" && node -e \"require('child_process').execSync('node dist/prisma/seed.js', {stdio:'inherit'})\" || node dist/prisma/seed.js"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inspect_network
    profiles:
      - migration

  # ============================================================================
  # 5. Frontend Web Service (Vite + React + Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_CDN_URL: ${VITE_CDN_URL:-https://pub-860509c206114698ad0b355f757c0bf3.r2.dev}
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - inspect_network

  # ============================================================================
  # 6. FFmpeg Service (linuxserver/ffmpeg)
  # ============================================================================
  # service is not used in the current versionThis
  # ffmpeg:
  #   image: linuxserver/ffmpeg:latest
  #   container_name: inspect_ffmpeg
  #   restart: unless-stopped
  #   entrypoint: ['tail', '-f', '/dev/null']
  #   networks:
  #     - inspect_network

# ==============================================================================
# Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
    name: inspect_postgres_data
    driver: local
  seaweedfs_data:
    name: inspect_seaweedfs_data
    driver: local

networks:
  inspect_network:
    name: inspect_network
    driver: bridge
