name: inspect

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: inspect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-inspect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-inspect}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inspect_network

  # ============================================================================
  # 2. SeaweedFS Object Storage Service (S3-compatible)
  # ============================================================================
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: inspect_seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip=seaweedfs"
    volumes:
      - seaweedfs_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/dir/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inspect_network

  # ============================================================================
  # 3. NestJS Application Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PORT: ${SERVER_PORT:-8000}
    container_name: inspect_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVER_PORT=${SERVER_PORT:-8000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-inspect}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-inspect}?schema=public
      - S3_ENDPOINT=${S3_ENDPOINT:-http://seaweedfs:8333}
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - inspect_network

  # ============================================================================
  # 4. Prisma Migration & Seed Service (Profile: migration)
  #    Run manually via: docker compose --profile migration up migration
  # ============================================================================
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: inspect_migration
    restart: "no"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-inspect}?schema=public
    command: sh -c "pnpm exec prisma migrate deploy && pnpm exec ts-node prisma/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inspect_network
    profiles:
      - migration

  # ============================================================================
  # 5. Frontend Web Service (Vite + React + Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: inspect_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - inspect_network

# ==============================================================================
# Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
    name: inspect_postgres_data
    driver: local
  seaweedfs_data:
    name: inspect_seaweedfs_data
    driver: local

networks:
  inspect_network:
    name: inspect_network
    driver: bridge
